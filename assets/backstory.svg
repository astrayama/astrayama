<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354">
<rect x="2" y="2" width="716" height="350" rx="12" fill="#fffdf7" stroke="#a34fc4" stroke-width="3"/>
<text x="24" y="38" font-family="Courier New, Courier, monospace" font-size="20" font-weight="bold" fill="#a34fc4">BACKSTORY</text>
<text x="36.0" y="86" font-family="Courier New, Courier, monospace" font-size="15" fill="#3b2b4a">Philosophy through characters. I help people see themselves clearly and</text>
<text x="36.0" y="112" font-family="Courier New, Courier, monospace" font-size="15" fill="#3b2b4a">evolve intentionally.</text>
<text x="36.0" y="150" font-family="Courier New, Courier, monospace" font-size="15" fill="#3b2b4a">Software engineer turned PM with a founder's instinct: shipped products</text>
<text x="36.0" y="176" font-family="Courier New, Courier, monospace" font-size="15" fill="#3b2b4a">at Microsoft (Azure) and Roblox (Studio), coached 1,000+ hackers as one</text>
<text x="36.0" y="202" font-family="Courier New, Courier, monospace" font-size="15" fill="#3b2b4a">of MLH's Top 50 community members, and won 18 hackathons.</text>
<text x="36.0" y="240" font-family="Courier New, Courier, monospace" font-size="15" fill="#3b2b4a">Currently finishing a cloud computing degree at Purdue (3.99 GPA) and</text>
<text x="36.0" y="266" font-family="Courier New, Courier, monospace" font-size="15" fill="#3b2b4a">building the Screen Sage universe: an ecosystem of apps, tarot, and</text>
<text x="36.0" y="292" font-family="Courier New, Courier, monospace" font-size="15" fill="#3b2b4a">content for seekers. Actively looking for product roles.</text>
<text x="36.0" y="330" font-family="Courier New, Courier, monospace" font-size="15" fill="#3b2b4a">2650+ hours of anime watched; can also read chakras, dreams, and tarot.</text>
